data:
  name: b14_ma2_m1_hip_pelvic2_delay_mod_0414_224217_26000+memo_b13_U500_k2_d1_cot_mod+on_0415_084515
  batch_size: 128

  in_lbl: [
#    "velocity",
    "Phase",
    "Stride",
    # "K",
    # "Delay",
  ]
  out_lbl: [
   "velocity",
   "cot_ma2",
  ]
  num_folds: null
  fold_idx: 0
  transform:
    func: metabolic_selected
    params:
      selection_x: velocity
      selection_y: cot_ma2
      selection_num: 50
      selection_margin: 10.0


trainer:
#  profiler: 'simple'
  max_epochs: 5000

  # If batch is large, make this value small to avoid overhead
  log_every_n_steps: 1

  logger:
    class_path: eo.learn.log.MemoLogger
    init_args:
      memo: ""

  callbacks:
    - class_path: eo.learn.log.EpochPBar
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: 'epoch'
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_weights_only: True
        monitor: 'loss/train'
        mode: 'min'
        save_top_k: 3
        filename: '{ep:.0f}_{loss:.2f}'


model:
  lr: 0.1
  layers: [64, 32]
#  grad_weight: 1
  l1_weight: 0.0001
  l2_weight: 0.0001
#  act_type: torch.nn.Tanh
